name: Verify Electrical Estimator
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund --prefer-online --fetch-retries=4
      - name: Offline calculation checks
        run: npm run check:core
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: electrical-estimator-dist
          path: dist/
